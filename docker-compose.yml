# One copy of the project = one instance = one container. The layout inside it
# is picked by scripts/start.js from .env (EDITOR_ENABLED / EDITOR_MODE):
#   EDITOR_ENABLED=off                  -> server.prod.js
#   EDITOR_ENABLED=on, EDITOR_MODE=prod -> server.prod.js + built editor-app
#   EDITOR_ENABLED=on, EDITOR_MODE=dev  -> scripts/dev.js (vite storefront + editor from source)
# The editor listens on loopback inside the container; the storefront proxies
# /editor to it, so only the storefront port is published.
#
# Ports come from the same .env (docker compose reads it for substitution):
#   HOST_PORT - port on the host machine (default 8250)
#   PORT      - port the storefront listens on inside the container (default 3000).
#               Leave DEV_PORT empty in Docker so the dev layout listens on PORT too.
# Several copies of the project on one machine only need different HOST_PORTs.
#
# git + ssh are for the editor, which runs in this container: every save
# commits, Push pushes with the host's key.
services:
  react-app:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "${HOST_PORT:-8250}:${PORT:-3000}"
    volumes:
      - .:/app
      - ${HOME}/.ssh:/root/.ssh:ro
    environment:
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      GIT_CONFIG_KEY_1: user.name
      GIT_CONFIG_VALUE_1: ${GIT_USER_NAME}
      GIT_CONFIG_KEY_2: user.email
      GIT_CONFIG_VALUE_2: ${GIT_USER_EMAIL}
    command: sh -c "apk add --no-cache git openssh-client && npm ci && npm run build && node scripts/start.js"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
